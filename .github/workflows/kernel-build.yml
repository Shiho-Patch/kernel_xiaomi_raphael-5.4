name: Kernel Build (raphael 5.4)

# 用途：
#   1) 把用户的 75/90Hz 高刷提交 rebase 到上游最新（在 runner 内完成，避免本地下载 1.4GB）
#   2) 编译验证，并顺带验证 P2(NFC) 使能改动
# 设计要点见 RECON.md / P2_CANDIDATE.md / CI_SETUP.md

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: '源码基线'
        type: choice
        options:
          - 'upstream-latest'   # 上游最新（c50effa 等）：P2 验证基准
          - 'fork-tip'          # 你的 fork 当前 tip（4807ce0，已含 75/90Hz）
          - 'rebase'            # 把 75/90Hz 提交 rebase 到上游最新（推荐）
        default: 'rebase'
      fork_repo:
        description: '你的 fork 仓库（rebase 模式从此处取 75/90Hz 提交）'
        type: string
        default: 'Shiho-Patch/kernel_xiaomi_raphael-5.4'
      hotfix_commit:
        description: '要 rebase 的高刷提交'
        type: string
        default: '4807ce0a763368502bff522a4c0cdc28050189c7'
      upstream_ref:
        description: '上游基线分支/提交'
        type: string
        default: 'zundamon-miui-5.4'
      nfc_enable:
        description: '应用 NFC 使能改动 (CONFIG_NFC_QTI_I2C=y)'
        type: boolean
        default: true
      nfc_extra_core:
        description: '同时开启内核 NFC 子系统（仅当符号被 Kconfig 丢弃时使用）'
        type: boolean
        default: false
      llvm_version:
        description: 'LLVM/clang 版本（本树 CFI+LTO，需与位码自洽）'
        type: string
        default: '12'

concurrency:
  group: kernel-${{ inputs.source_mode }}-${{ inputs.nfc_enable }}-${{ inputs.nfc_extra_core }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: HeliumStudio-Dev/kernel_xiaomi_raphael-5.4
  ARCH: arm64
  # 实测自 arch/arm64/configs/vendor/ —— 不是 raphael_defconfig
  DEFCONFIG: vendor/sm8150-qgki_defconfig

jobs:
  build:
    name: ${{ inputs.source_mode }}${{ inputs.nfc_enable && ' +NFC' || '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      # ---------------------------------------------------------------- 取源码
      - name: Checkout (upstream-latest / fork-tip)
        if: ${{ inputs.source_mode != 'rebase' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_mode == 'fork-tip' && inputs.fork_repo || env.UPSTREAM_REPO }}
          ref: ${{ inputs.source_mode == 'fork-tip' && 'zundamon-miui-5.4' || inputs.upstream_ref }}
          path: kernel
          fetch-depth: 1
          filter: blob:none

      - name: Checkout (rebase base)
        if: ${{ inputs.source_mode == 'rebase' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref }}
          path: kernel
          fetch-depth: 1
          filter: blob:none

      # rebase 需要 fork 的提交对象：单独 fetch 那一个 commit的完整内容
      - name: Fetch hotfix commit from fork
        if: ${{ inputs.source_mode == 'rebase' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          git config user.email "ci@raphael.local"
          git config user.name  "raphael-ci"
          git remote add fork "https://github.com/${{ inputs.fork_repo }}.git"
          echo "--- fetching ${{ inputs.hotfix_commit }} and its history ---"
          # 需要父提交以正确计算 diff
          git fetch --no-tags --filter=blob:none fork "${{ inputs.hotfix_commit }}"
          echo "fetched: $(git rev-parse FETCH_HEAD)"
          echo "--- commit subject ---"
          git log -1 --format='%H%n%an <%ae>%n%s' FETCH_HEAD

      - name: Apply hotfix onto upstream (cherry-pick)
        if: ${{ inputs.source_mode == 'rebase' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD)
          echo "base(upstream): $BASE"
          HOTFIX=$(git rev-parse FETCH_HEAD)
          echo "hotfix: $HOTFIX"

          # 先确认三个目标文件在基线上的样子（诊断用）
          echo "=== 目标文件是否存在于基线 ==="
          for f in arch/arm64/boot/dts/qcom/display/dsi-panel-ss-fhd-ea8076-cmd.dtsi \
                   arch/arm64/boot/dts/qcom/display/dsi-panel-ss-fhd-ea8076-global-cmd.dtsi \
                   arch/arm64/boot/dts/qcom/sm8150-sde-display.dtsi; do
            if git cat-file -e "$BASE:$f" 2>/dev/null; then echo "  OK   $f"; else echo "  MISS $f"; fi
          done

          echo "=== 尝试 cherry-pick ==="
          if git cherry-pick -x "$HOTFIX"; then
            echo "::notice::cherry-pick 干净成功，无冲突"
          else
            echo "::error title=Rebase conflict::cherry-pick 产生冲突，需人工介入。"
            echo "--- 冲突文件 ---"
            git status --porcelain || true
            echo "--- 冲突详情 ---"
            git diff --name-only --diff-filter=U || true
            git diff || true
            exit 1
          fi

          echo "=== rebase 后提交 ==="
          git log --oneline -3
          echo "=== 改动统计 ==="
          git --no-pager diff --stat "$BASE" HEAD

      - name: Show source identity
        working-directory: kernel
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "SUBLEVEL: $(grep -m1 '^SUBLEVEL' Makefile)"
          echo "--- ea8076 timing 数量（应为 3：60/75/90）---"
          grep -c 'timing@' arch/arm64/boot/dts/qcom/display/dsi-panel-ss-fhd-ea8076-cmd.dtsi || true

      # ------------------------------------------------------------ 环境准备
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip rsync cpio kmod device-tree-compiler \
            python3 python-is-python3 zstd lz4
          df -h /

      # 用 apt 安装 LLVM/LLD。不用第三方 setup action：
      # 上一轮 run 中 ZhongRuoyu/setup-llvm 被 skipped，导致 clang/ld.lld 完全缺失，
      # 进而 Makefile 的 kernelrelease 校验失败、.config 无法生成。
      - name: Install LLVM/LLD ${{ inputs.llvm_version }}
        run: |
          set -euo pipefail
          V="${{ inputs.llvm_version }}"

          # ubuntu-22.04 预装 llvm-12..15；直接按版本号装
          if apt-cache show "clang-$V" >/dev/null 2>&1; then
            echo "从默认源安装 clang-$V / lld-$V"
            sudo apt-get install -y --no-install-recommends \
              "clang-$V" "lld-$V" "llvm-$V" libclang-common-"$V"-dev
          else
            echo "默认源无 clang-$V，添加 apt.llvm.org"
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-$V main" \
              | sudo tee /etc/apt/sources.list.d/llvm-$V.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              "clang-$V" "lld-$V" "llvm-$V" libclang-common-"$V"-dev
          fi

          # 建立无版本号的符号链接（kbuild 调用裸 clang / ld.lld）
          LLVM_BIN="/usr/lib/llvm-$V/bin"
          test -d "$LLVM_BIN" || { echo "::error::$LLVM_BIN 不存在"; ls /usr/lib | grep -i llvm || true; exit 1; }

          sudo mkdir -p /usr/local/bin
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-size llvm-strip llvm-dwarfdump; do
            if [ -e "$LLVM_BIN/$t" ]; then
              sudo ln -sf "$LLVM_BIN/$t" "/usr/local/bin/$t"
            else
              echo "::warning::缺少 $t"
            fi
          done
          hash -r

      - name: Verify toolchain
        run: |
          set -euo pipefail
          echo "--- which ---"
          for t in clang ld.lld llvm-ar llvm-nm; do
            printf '%-10s -> %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
          echo "--- versions ---"
          clang --version | head -n2
          ld.lld --version
          llvm-ar --version | head -n1
          # 硬性断言：缺任何一个立即失败，避免再次白跑一小时
          command -v clang   >/dev/null || { echo "::error::clang 缺失"; exit 1; }
          command -v ld.lld  >/dev/null || { echo "::error::ld.lld 缺失"; exit 1; }
          echo "OK: LLVM 工具链就位"

      # ------------------------------------------------------------ NFC 改动
      - name: Apply P2 NFC candidate change
        if: ${{ inputs.nfc_enable }}
        working-directory: kernel
        run: |
          set -euo pipefail
          CFG="arch/arm64/configs/${DEFCONFIG}"
          test -f "$CFG" || { echo "::error::defconfig not found: $CFG"; exit 1; }

          ANCHOR_CNT=$(grep -c '^CONFIG_I2C_CHARDEV=y$' "$CFG" || true)
          echo "anchor occurrences: $ANCHOR_CNT"

          sed -i '/^CONFIG_NFC_QTI_I2C=/d' "$CFG"
          if [ "${{ inputs.nfc_extra_core }}" = "true" ]; then
            sed -i -e '/^CONFIG_NFC_NCI=/d' -e '/^CONFIG_NFC=/d' "$CFG"
            printf 'CONFIG_NFC=%s\nCONFIG_NFC_NCI=%s\n' y y >> "$CFG"
          fi
          if [ "$ANCHOR_CNT" -eq 1 ]; then
            sed -i '/^CONFIG_I2C_CHARDEV=y$/a CONFIG_NFC_QTI_I2C=y' "$CFG"
          else
            echo "::warning::锚点不唯一，追加到末尾"
            echo 'CONFIG_NFC_QTI_I2C=y' >> "$CFG"
          fi

          echo "=== diff ==="
          git --no-pager diff -- "$CFG"

      # ------------------------------------------------------------ 配置 + 构建
      - name: Generate config
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p out
          echo "--- 工具链自检（kbuild 会用 \$(CC) 探测版本）---"
          clang --version | head -n1
          echo "--- 生成 defconfig ---"
          if ! make -C "$PWD" O=out ARCH=${ARCH} LLVM=1 LLVM_IAS=1 ${DEFCONFIG}; then
            echo "::error title=defconfig failed::配置生成失败"
            echo "### 诊断"
            echo "- defconfig 文件: $(ls -l arch/arm64/configs/${DEFCONFIG} 2>&1)"
            echo "- clang: $(command -v clang || echo MISSING)"
            echo "- ld.lld: $(command -v ld.lld || echo MISSING)"
            echo "- 源码是否干净: $(git status --porcelain | wc -l) 个改动"
            exit 1
          fi
          echo "--- .config 行数: $(wc -l < out/.config) ---"

      - name: Verify NFC symbol not dropped
        if: ${{ inputs.nfc_enable }}
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "--- NFC entries in .config ---"
          grep -nE 'NFC' out/.config || true
          if ! grep -qx 'CONFIG_NFC_QTI_I2C=y' out/.config; then
            echo "::error title=NFC symbol dropped::CONFIG_NFC_QTI_I2C=y 未出现在 out/.config"
            echo "::error::补救：重跑并勾选 nfc_extra_core"
            grep -E '^CONFIG_I2C' out/.config || true
            exit 1
          fi
          echo "OK: NFC 符号保留"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          make -C "$PWD" O=out ARCH=${ARCH} LLVM=1 LLVM_IAS=1 -j"$(nproc)"

      - name: Collect diagnostics on failure
        if: failure()
        working-directory: kernel
        run: |
          echo "=== 关键错误行（keep-going 重跑）==="
          make -C "$PWD" O=out ARCH=${ARCH} LLVM=1 LLVM_IAS=1 -j"$(nproc)" -k 2>&1 \
            | tail -n 600 | grep -iE 'error|fatal|undefined|warning: .*panel' | head -n 200 || echo "(无错误行)"
          echo "=== 关键 config ==="
          grep -E '^CONFIG_(LTO|CFI|LD_IS|NFC|I2C)' out/.config || true

      - name: Verify nfc driver built
        if: success() && inputs.nfc_enable
        working-directory: kernel
        run: |
          set -euo pipefail
          # 判定依据说明：
          #  - CONFIG_NFC_QTI_I2C=y 时 kbuild 只产出 built-in.a，不生成 nfc_i2c.o（那是 =m 才有）
          #  - 本树 CONFIG_LTO_CLANG=y，vmlinux 经 LTO 合并后静态符号名被本地化，
          #    llvm-nm vmlinux | grep 函数名 不可靠 → 改用 LTO 中间产物 vmlinux.o + 目标文件三重佐证
          FAIL=0

          echo "=== 1) 驱动目标文件 ==="
          for f in drivers/nfc/qti/nfc_common.o drivers/nfc/qti/nfc_i2c_drv.o; do
            O=$(find out -path "*${f}" -print -quit)
            if [ -n "$O" ]; then echo "  OK   $f ($(stat -c%s "$O") bytes)"; else echo "  MISS $f"; FAIL=1; fi
          done

          echo "=== 2) built-in.a 归档 ==="
          A=$(find out -path '*drivers/nfc/qti/built-in.a' -print -quit)
          if [ -n "$A" ]; then echo "  OK   $A ($(stat -c%s "$A") bytes)"; else echo "  MISS qti/built-in.a"; FAIL=1; fi

          echo "=== 3) 符号检查（对 LTO 安全的方式）==="
          # 3a: 目标文件里必然有符号（未经 LTO）
          if llvm-nm out/drivers/nfc/qti/nfc_i2c_drv.o 2>/dev/null | grep -q 'nfc_i2c_dev_probe'; then
            echo "  OK   nfc_i2c_drv.o 含 nfc_i2c_dev_probe"
          else
            echo "  WARN nfc_i2c_drv.o 未直接匹配（可能被内联）"
          fi
          # 3b: LTO 中间产物 vmlinux.o（未做最终 strip/本地化）
          if [ -f out/vmlinux.o ]; then
            if llvm-nm out/vmlinux.o 2>/dev/null | grep -qiE 'nfc_i2c|nfc_parse_dt|nq-nci'; then
              echo "  OK   vmlinux.o 含 NFC 符号"
              llvm-nm out/vmlinux.o | grep -iE 'nfc_i2c|nfc_parse_dt' | head -n 5 || true
            else
              echo "  WARN vmlinux.o 未见 NFC 符号（LTO 可能已本地化/内联，属预期）"
            fi
          else
            echo "  WARN 无 vmlinux.o"
          fi
          # 3c: .config 双重确认
          grep -qx 'CONFIG_NFC_QTI_I2C=y' out/.config \
            && echo "  OK   .config: CONFIG_NFC_QTI_I2C=y" \
            || { echo "  MISS .config 中无 NFC_QTI_I2C"; FAIL=1; }

          echo "=== 4) 内核镜像 ==="
          ls -lh out/arch/arm64/boot/Image

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::NFC 驱动确实未编译（目标文件/归档/.config 缺失）"
            exit 1
          fi
          echo "::notice::NFC 驱动已编译并归档（LTO 下不依赖 vmlinux 符号名）"

      - name: Gather artifacts
        if: success()
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/Image* || true
          ls -lh out/arch/arm64/boot/dtbo.img 2>/dev/null || true
          find out -name '*.dtb' | head -n 30 || true
          echo "=== sha256 ==="
          sha256sum out/arch/arm64/boot/Image 2>/dev/null || true
          echo "=== 生成的 dtbo 中是否含 ea8076 三档 timing ==="
          grep -c 'timing@' arch/arm64/boot/dts/qcom/display/dsi-panel-ss-fhd-ea8076-cmd.dtsi || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raphael-${{ inputs.source_mode }}-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/.config
          if-no-files-found: warn
          retention-days: 14

      - name: Upload rebase patch
        if: always() && inputs.source_mode == 'rebase'
        working-directory: kernel
        run: |
          git format-patch -1 HEAD --stdout > /tmp/rebased-hotfix.patch 2>/dev/null \
            || git format-patch -1 HEAD | xargs -I{} cp {} /tmp/rebased-hotfix.patch || true
          ls -l /tmp/rebased-hotfix.patch 2>/dev/null || true

      - name: Upload patch
        if: always() && inputs.source_mode == 'rebase'
        uses: actions/upload-artifact@v4
        with:
          name: rebased-patch-${{ github.run_number }}
          path: /tmp/rebased-hotfix.patch
          if-no-files-found: warn
          retention-days: 14

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ github.run_number }}
          # 注意路径前缀必须是 kernel/（工作目录是仓库根，非 kernel/）
          path: |
            kernel/out/.config
            kernel/.config
          if-no-files-found: warn
          retention-days: 7
